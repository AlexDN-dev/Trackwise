server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans les erreurs / en-têtes
    server_tokens off;

    # Bloque les fichiers/dossiers cachés sensibles (.env, .git, .htaccess…)
    # → vrai 404, au lieu du fallback SPA Angular (qui renverrait index.html en 200)
    # .well-known est laissé passer (ACME, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Assets fingerprintés (Angular ajoute un hash) → cache long
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA : toute route inconnue renvoie index.html (routing Angular côté client)
    # index.html en no-cache → le navigateur récupère toujours les derniers assets fingerprintés après un déploiement
    location / {
        add_header Cache-Control "no-cache" always;

        # --- En-têtes de sécurité ---
        # (add_header dans un bloc location écrase l'héritage → on les déclare ici,
        #  sur les réponses "document" qui en ont réellement besoin)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CSP servie en en-tête HTTP (remplace la balise <meta> de l'index.html).
        # frame-ancestors 'none' double X-Frame-Options pour les navigateurs récents.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        try_files $uri $uri/ /index.html;
    }
}
