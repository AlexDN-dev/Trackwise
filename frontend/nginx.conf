server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets fingerprintés (Angular ajoute un hash) → cache long
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue renvoie index.html (routing Angular côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
