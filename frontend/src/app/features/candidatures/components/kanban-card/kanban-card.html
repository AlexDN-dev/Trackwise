<div class="kc-top">
  <div class="klogo" [class]="logoCls()">{{ initial() }}</div>
  <div class="kc-right">
    <div class="score" [class]="scoreClass()" [title]="scoreTooltip()">{{ scoreDisplay() }}</div>
    <button class="kmenu-btn" type="button" (click)="toggleMenu($event)" title="Menu">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <circle cx="8" cy="3" r="1.4"></circle>
        <circle cx="8" cy="8" r="1.4"></circle>
        <circle cx="8" cy="13" r="1.4"></circle>
      </svg>
    </button>

    @if (menuOpen() && menuPos(); as pos) {
      <div class="card-menu" [style.top.px]="pos.top" [style.left.px]="pos.left">
        <button type="button" class="cmi" (click)="onEdit($event)">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
            <path d="M12.5 2.5l3 3L6 15l-3.5.5L3 12l9.5-9.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
          </svg>
          Modifier
        </button>
        @if (canMoveLeft()) {
          <button type="button" class="cmi" (click)="onMoveLeft($event)">
            <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
              <path d="M11 4l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            Basculer à gauche
          </button>
        }
        @if (canMoveRight()) {
          <button type="button" class="cmi" (click)="onMoveRight($event)">
            <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
              <path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            Basculer à droite
          </button>
        }
        <div class="cmi-sep"></div>
        <button type="button" class="cmi cmi-del" (click)="onDelete($event)">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
            <path d="M3 5h12M7 5V3.5h4V5M4.5 5l.7 9.5a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9L14 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          Supprimer
        </button>
      </div>
    }
  </div>
</div>

<div class="ktitle">{{ card().title }}</div>
<div class="kcompany">{{ card().entrepriseName }}</div>

<div class="kc-foot">
  @if (card().location) {
    <span class="kloc">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
        <path d="M6 1.2a3.4 3.4 0 0 0-3.4 3.4c0 2.4 3.4 6 3.4 6s3.4-3.6 3.4-6A3.4 3.4 0 0 0 6 1.2z" stroke="currentColor" stroke-width="1.2"></path>
        <circle cx="6" cy="4.6" r="1.1" stroke="currentColor" stroke-width="1.1"></circle>
      </svg>
      {{ card().location }}
    </span>
  } @else {
    <span></span>
  }
  <span class="kdate">{{ date() }}</span>
</div>
