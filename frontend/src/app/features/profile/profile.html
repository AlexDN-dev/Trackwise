<div class="app">
  <!-- HEADER (identique au kanban, "Paramètres" actif) -->
  <header class="hdr">
    <div class="hbrand">
      <svg class="mk" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="9" fill="var(--accent)"></rect>
        <path d="M9 17.2l4.4 4.4L23 10.8" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      </svg>
      <span class="wm">Trackwise</span>
    </div>

    <nav class="nav">
      <button type="button" class="navlink" routerLink="/candidatures">Tableau</button>
      <button type="button" class="navlink">Statistiques</button>
      <button type="button" class="navlink">Documents</button>
      <button type="button" class="navlink on">Paramètres</button>
    </nav>

    <div class="hspace"></div>

    <button type="button" class="iconbtn" (click)="logout()" title="Se déconnecter">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M8 3H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 7l3 3-3 3M16 10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div class="subbar">
    <span class="pgtitle">Paramètres</span>
    <span class="pgcount">Compte & préférences</span>
    <div class="hspace"></div>
  </div>

  <div class="pshell">
    <!-- Sidebar -->
    <aside class="pside">
      <nav class="pnav">
        <a
          class="pnav-item"
          routerLink="/profil/informations"
          routerLinkActive="on"
        >
          <span class="pnav-ic">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3.2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3.5 17c.8-3.2 3.3-5 6.5-5s5.7 1.8 6.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="pnav-t">Informations</span>
        </a>

        <a
          class="pnav-item"
          routerLink="/profil/securite"
          routerLinkActive="on"
        >
          <span class="pnav-ic">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="9" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="pnav-t">Sécurité</span>
        </a>

        <a
          class="pnav-item"
          routerLink="/profil/competences"
          routerLinkActive="on"
        >
          <span class="pnav-ic">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
              <path d="M10 2l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8L10 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="pnav-t">Compétences</span>
        </a>

        <a
          class="pnav-item pnav-premium"
          routerLink="/profil/abonnement"
          routerLinkActive="on"
        >
          <span class="pnav-ic">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
              <path d="M3 7l3 8h8l3-8-4 3-3-5-3 5-4-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="pnav-t">Abonnement</span>
          <span class="pnav-badge">Free</span>
        </a>
      </nav>
    </aside>

    <!-- Contenu -->
    <section class="pmain">
      <router-outlet />
    </section>
  </div>
</div>
