@if (quota(); as q) {
  <a
    routerLink="/profil/abonnement"
    class="badge"
    [class.premium]="isPremium()"
    [class.danger]="isDanger()"
    [title]="isPremium() ? 'Analyses IA illimitées' : q.used + ' / ' + q.limit + ' analyses IA utilisées ce mois'"
  >
    <span class="icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
        <path
          d="M10 2v3M10 15v3M2 10h3M15 10h3M4.9 4.9l2.1 2.1M13 13l2.1 2.1M4.9 15.1L7 13M13 7l2.1-2.1"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="label">
      @if (isPremium()) {
        <span class="count">∞</span>
      } @else {
        <span class="count">{{ q.used }}/{{ q.limit }}</span>
      }
    </span>

    <span class="bar">
      <span class="fill" [style.width.%]="barPercent()"></span>
    </span>
  </a>
}
